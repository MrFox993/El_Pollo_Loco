<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>El Pollo Loco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BioRhyme:wght@200..800&family=Sancreek&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
    <script src="./classes/drawableObject.class.js"></script>
    <script src="./classes/movableObject.class.js"></script>
    <script src="./classes/throwableObject.class.js"></script>
    <script src="./classes/collectableObject.class.js"></script>
    <script src="./classes/statusbar.class.js"></script>
    <script src="./classes/character.class.js"></script>
    <script src="./classes/chicken.class.js"></script>
    <script src="./classes/cloud.class.js"></script>
    <script src="./classes/background.class.js"></script>
    <script src="./classes/keyboard.class.js"></script>
    <script src="./classes/level.class.js"></script>
    <script src="./classes/endboss.class.js"></script>
    <script src="./classes/bottle.class.js"></script>    
    <script src="./classes/coin.class.js"></script>    
    <script src="./levels/level1.js"></script>
    <script src="./classes/audioManager.class.js"></script>
    <script src="./scripts/mobile-ui.js" defer></script>
    <script src="./scripts/game.js"></script>
    <script src="./classes/world.class.js"></script>
    
  <script>
    window.audioManager = new AudioManager({
      bgmMenu: { src: 'assets/audio/acoustic-mexican-guitar-218610.mp3',   loop: true, volume: 0.4 },
      bgmGame: { src: 'assets/audio/mexican-mexico-music-434632.mp3', loop: true, volume: 0.15 },
      walking: { src: 'assets/audio/person-walking-on-rocks-and-sand-100586.mp3', loop: true, volume: 1.0 },
      jump: { src: 'assets/audio/cartoon-jump-6462.mp3', volume: 1.0 },
      hpLost:    { src: 'assets/audio/ouch-sound-effect-30-11844.mp3', volume: 1.0 },
      snoring:    { src: 'assets/audio/male-snore-1-29322.mp3', loop: true, volume: 1.0 },
      enemyHit:  { src: 'assets/audio/chicken-430403.mp3',  volume: 0.8 },
      endbossHit:  { src: 'assets/audio/chicken-single-alarm-call-6056.mp3',  volume: 0.8 },
      endbossWalking:  { src: 'assets/audio/chicken-sound-402826.mp3',  loop: true, volume: 0.8 },
      coin: { src: 'assets/audio/coin-257878.mp3', volume: 0.8 },
      bottleCollect: { src: 'assets/audio/shatter-363188.mp3', volume: 0.7 },
      bottleShatter: { src: 'assets/audio/glass-smash-6266.mp3', volume: 0.7 },
      gameOver: { src: 'assets/audio/cartoon-trombone-sound-effect-241387.mp3', volume: 0.8 },
      youWin: { src: 'assets/audio/you-win-sfx-442128.mp3', volume: 0.8 }
    }, {
      muteButton: '#muteBtn',                 
      iconMode:   'img',                      
      iconOn:     'assets/icons/volume_on.svg',
      iconOff:    'assets/icons/volume_off.svg',
      shortcutKey:'m'                         
    });
  </script>

  </head>
  <body>
    <header>
      <h1>El Pollo Loco</h1>
    </header>
    <main>
      <section class="main-screen">
        <div class="menu-screen show-screen" id="menuScreen">
          <button type="button" class="start-game-button" onclick="startNewGame()">Start New Game</button>
          <div class="navigation">
            <button type="button" class="navigation-buttons" onclick="toggleScreen('menuScreen', 'hide'), toggleScreen('controlScreen', 'show')">Controls</button>
            <button type="button" class="navigation-buttons" onclick="">Legal Notice</button>
            <button type="button" id="muteBtn" class="navigation-buttons" aria-pressed="false" title="Mute/Unmute (Key M)">
              <img id="muteIcon" src="./assets/icons/volume_on.svg" alt="mute">
              <span class="visually-hidden">Sound</span>
            </button>
          </div>
        </div>
        <div class="menu-screen hide-screen" id="controlScreen">
          <div class="control-box">
            <h2>Controls</h2>
            <table>
              <tr>
                <th>Move Left</th>
                <td>Left Arrow or a</td>
              </tr>
              <tr>
                <th>Move Right</th>
                <td>Right Arrow or d</td>
              </tr>
              <tr>
                <th>Jump</th>
                <td>Up Arrow or w or Spacebar</td>
              </tr>
              <tr>
                <th>Throw Bottle</th>
                <td>c</td>
              </tr>
              <tr>
                <th>Mute/Unmute Game</th>
                <td>m</td>
              </tr>
            </table>
          </div>
          <div class="navigation">
            <button type="button" class="navigation-buttons" onclick="toggleScreen('controlScreen', 'hide'), toggleScreen('menuScreen', 'show')">Back</button>
            <button type="button" class="navigation-buttons" onclick="startNewGame()">Start New Game</button>
          </div>
        </div>
      </section>
      <section class="canvas-screen">
        <canvas id="canvas" width="720px" height="480px"> </canvas>
      </section>
      <section class="end-screens">
        <div id="youWonScreen" class="end-screen hide-screen">
            <img src="./assets/img/YouWonYouLost/YouWinA.png" alt="You Win">
            <div class="navigation">
              <button type="button" class="navigation-buttons" onclick="goToMainMenu()">Main Menu</button>
              <button type="button" class="navigation-buttons" onclick="startNextLevel()" disabled >Next Level</button>
            </div>
        </div>

        <div id="youLostScreen" class="end-screen hide-screen">
            <img src="./assets/img/YouWonYouLost/GameOver.png" alt="Game Over"> 
            <div class="navigation">
              <button type="button" class="navigation-buttons" onclick="goToMainMenu()">Main Menu</button>
              <button type="button" class="navigation-buttons" onclick="startNewGame()">Restart Level</button>
            </div>
        </div>
      </section>
      
      <div id="rotateOverlay" class="rotate-overlay" role="dialog" aria-live="assertive" aria-hidden="true">
        <div class="rotate-content">
          <img src="./assets/img/rotate_device.png" alt="Please rotate your device">
        </div>
      </div>
      
      <div id="mobileControls" class="mobile-controls" oncontextmenu="return false" aria-label="Mobile Steuerung" aria-hidden="true">
        <button id="btnLeft"  class="control-btn" aria-label="Nach links" title="Links">⟵</button>
        <button id="btnRight" class="control-btn" aria-label="Nach rechts" title="Rechts">⟶</button>
        <button id="btnJump"  class="control-btn" aria-label="Springen" title="Springen">⤴︎</button>
        <button id="btnThrow" class="control-btn" aria-label="Werfen"  title="Werfen">🧪</button>
      </div>

    </main>
  </body>
</html>
